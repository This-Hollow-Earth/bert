# BERT v1 Module definitions
#
# Decided in THI-12 (grilling with Arjen, 2026-09-24).
# Constraints from THI-73: content is YAML data under a typed schema, validated
# at build, so adding or rewording a Module is a content edit, not a code change.
#
# Fixed list — every respondent answers every Module. There is no skip: staged
# Modules carry an explicit "we don't have this function" answer so absence is
# captured as data rather than as a blank (feeds the deferred org-wide
# enterprise-readiness axis, THI-15).
#
# ids are STABLE FOREVER and never reused. A future Module split creates new
# ids and retires the old one; it does not reuse the parent id. This is what
# makes dated assessments comparable across editions.
#
# Two Module kinds:
#   staged — placed on the Cons2SaaS curve (1-5) via the 5-option question
#   binary — a yes/no on whether a dedicated person or team exists. These sit
#            OUTSIDE the consultancy-to-SaaS tension; they are presence-signals
#            of a mature organisation, which is why they are not staged.
#
# NOTE: the five stage option texts below are THI-11's wording, carried over
# verbatim and NOT yet neutral-voiced. They are written in the client's voice
# ("your team is still configuring things manually"), but the v1 site is
# user-agnostic — it cannot know whether a consultant or the client is
# answering. The neutral-voice pass is outstanding work on THI-12.

schema_version: 1

groups:
  - id: commercial
    name: Commercial
  - id: delivery
    name: Delivery
  - id: product-engineering
    name: Product & Engineering
  - id: corporate
    name: Corporate

# Cons2SaaS stages. Shared across every staged Module in v1 (generic wording;
# per-Module authored wording is a v2 upgrade, see THI-11).
#
# VOICE (THI-116): written in the third person about "the team" and "the
# organisation", never "we"/"us"/"your team". The site is user-agnostic — a
# consultant may be assessing a client, the client may be self-assessing, or
# both may be reading one screen together. Any first- or second-person phrasing
# silently assumes one of those and reads wrong for the others.
#
# `{requester}` is substituted per Module at render time (see `requester` on
# each Module below; defaults to "clients"). It always appears in a position
# where a plural noun phrase reads naturally.
stages:
  - id: A
    stage: 1
    name: Consultancy
    text: >-
      Every request starts from scratch. Each time {requester} need something
      here, it is handled individually, from the ground up. The work depends
      heavily on whichever senior person picks it up. How long a request takes,
      and what it costs, is hard to predict. The same kind of request comes back
      every few months and is solved fresh each time, with nothing carried over
      from the last one.
  - id: B
    stage: 2
    name: Automated Consultancy
    text: >-
      Internal tools exist, but a person still runs them. The same requests kept
      coming back, so the team built scripts, templates or internal tools that
      make handling them faster. Someone still has to run those tools by hand for
      every request. {requester} are starting to ask whether they could use the
      tool directly, or subscribe to it, instead of asking a person to run it for
      them.
  - id: C
    stage: 3
    name: Hybrid
    text: >-
      It looks self-serve, but someone is still behind the curtain. On the
      surface {requester} can help themselves. In practice the team still
      configures things manually for every request and patches exceptions on the
      fly. Getting set up takes weeks, not minutes. Feedback gets stuck between
      "is this a bug" and "is this a missing feature", with no clear owner. Each
      additional requester adds real work for the team, not just a checkbox.
  - id: D
    stage: 4
    name: Big Head SaaS
    text: >-
      Mostly self-serve, but the biggest requests still need people. Most of
      {requester} get what they need without help, and the cost and turnaround
      are reasonably predictable. The largest, highest-stakes requests still need
      hand-holding, onboarding support, or a dedicated point of contact. Every
      one-off exception granted here risks dragging things back toward the
      previous stage.
  - id: E
    stage: 5
    name: Long Tail SaaS
    text: >-
      Self-serve, at near-zero effort from the team. Someone new among
      {requester} can get what they need without ever talking to anyone. The cost
      of serving one more is close to zero. The team's time goes toward handling
      volume, not handling complexity or exceptions.
    # Stage 5 has no next rung. THI-74: say what HOLDING it requires rather than
    # inventing a stage 6. Used by the results page instead of next-stage text.
    holding: >-
      There is no next stage. Holding this one means keeping the cost of the next
      request near zero as volume grows — every exception, bespoke arrangement or
      manual step that creeps back in pulls this function toward the previous
      stage.

# Answer offered on every staged Module instead of allowing a skip.
# Voice note (THI-116): "this function" rather than "we" — the respondent may be
# assessing someone else's organisation.
absent_answer:
  id: X
  text: This function doesn't exist here.

# Order is narrative, not ranked: it starts where every firm recognises itself
# (Service Delivery) and ends with the two binary org-maturity signals.
#
# `requester` names who asks this Module for things; it is substituted into
# `{requester}` in the stage text above. It defaults to "clients" and is only
# written where it differs. THI-116: values are plural noun phrases with no
# possessive ("the delivery and commercial teams", not "your delivery teams"),
# so they read the same whether a consultant or the client is answering.
modules:
  - id: service-delivery
    name: Service Delivery
    order: 1
    group: delivery
    office: front
    kind: staged

  - id: onboarding-support
    name: Onboarding & Support
    order: 2
    group: delivery
    office: front
    kind: staged

  - id: product
    name: Product
    order: 3
    group: product-engineering
    office: back
    kind: staged
    requester: the delivery and commercial teams

  - id: engineering
    name: Engineering
    order: 4
    group: product-engineering
    office: back
    kind: staged
    requester: the delivery teams and product

  - id: methodology-data
    name: Methodology & Data
    order: 5
    group: product-engineering
    office: back
    kind: staged
    requester: the analysts and delivery teams

  - id: sales-marketing
    name: Sales & Marketing
    order: 6
    group: commercial
    office: front
    kind: staged

  - id: finance-contracting
    name: Finance & Contracting
    order: 7
    group: corporate
    office: back
    kind: staged
    requester: the commercial and delivery teams

  # Binary Modules. THI-116: phrased as "Is there…" rather than "Do you have…",
  # so the question does not assume the respondent belongs to the organisation.
  - id: legal-compliance
    name: Legal & Compliance
    order: 8
    group: corporate
    office: back
    kind: binary
    question: Is there a dedicated person or team for legal and compliance?

  - id: people-hr
    name: People & HR
    order: 9
    group: corporate
    office: back
    kind: binary
    question: Is there a dedicated person or team for people and HR?
